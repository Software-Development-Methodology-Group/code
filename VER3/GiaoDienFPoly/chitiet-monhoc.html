            transition: 0.2s ease; 
        }
        
        .sub-menu-item i {
            font-size: 1.2rem;
            margin-right: 15px;

            width: 25px;

        }

        .sub-menu-item:hover { color: var(--primary-orange); background: var(--primary-light); }
        .sub-menu-item:hover i { color: var(--primary-orange); }

        .sub-menu-item.active { background: var(--primary-light); color: var(--primary-orange); font-weight: bold; border-left: 4px solid var(--primary-orange); }
        .sub-menu-item.active i { color: var(--primary-orange); }
