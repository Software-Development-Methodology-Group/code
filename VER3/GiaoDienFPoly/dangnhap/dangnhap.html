<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập & Đăng ký - FPT Polytechnic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body >
    <img src="../images/background2.jpg" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1;">
    <div class="login-container" >
        <div class="login-left d-none d-md-flex">
            <h2 class="fw-bold mb-3">FPT Polytinic</h2>
            <p class="fs-6">Hệ thống Quản lý Đào tạo toàn diện dành cho Sinh viên và Cán bộ Giảng viên.</p>
            <div class="mt-4 p-3 bg-white bg-opacity-25 rounded border border-light">
                <p>Xin chào👋</p>
            </div>
        </div>

        <div class="login-right">
            
            <div id="loginFormSection" class="form-section active">
                <div class="text-center mb-4">
                    <h3 class="fw-bold text-dark">Đăng nhập</h3>
                    <p class="text-muted small">Chào mừng bạn quay lại hệ thống</p>
                </div>

                <form onsubmit="processLogin(event)">
                    <label class="fw-bold small mb-1">Cơ sở đào tạo</label>
                    <select class="form-select text-muted">
                        <option value="hn">FPT Polytechnic Hà Nội</option>
                        <option value="hcm">FPT Polytechnic Hồ Chí Minh</option>
                    </select>
                    <input type="email" style="display:none" autocomplete="email">
                    <input type="password" style="display:none" autocomplete="current-password">    
                    <label class="fw-bold small mb-1">Email (Tài khoản FPT)</label>
                    <div class="input-group mb-3">
                     
                        <span class="input-group-text"><i class="bi bi-envelope-fill"></i></span>
                        <input type="email" class="form-control with-icon" id="loginUsername" autocomplete="off" readonly onfocus="this.removeAttribute('readonly');" placeholder="Nhập email" required>
                    </div>

                    <label class="fw-bold small mb-1">Mật khẩu</label>
                    <div class="input-group mb-3">
                        <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                        <input type="password" class="form-control with-icon" id="loginPassword" autocomplate="new-password" placeholder="Nhập mật khẩu" required>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-3 small">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="rememberMe">
                            <label class="form-check-label text-muted" for="rememberMe">Ghi nhớ</label>
                        </div>
                        <a href="#" class="toggle-link">Quên mật khẩu?</a> 
                         
                         
                    </div>

                    <button type="submit" class="btn-custom" id="btnLogin">
                        <i class="bi bi-box-arrow-in-right me-2"></i> Đăng nhập vào hệ thống
                    </button>
                </form>

                <div class="text-center mt-4 small">
                    Sinh viên mới nhập học? <span class="toggle-link" onclick="toggleForms('register')">Tạo tài khoản ngay</span>
                </div>
            </div>

            <div id="registerFormSection" class="form-section">
                <div class="text-center mb-3">
                    <h3 class="fw-bold text-dark">Tạo tài khoản</h3>
                    <p class="text-muted small">Dành cho Tân sinh viên chưa được cấp thẻ</p>
                </div>

                <form onsubmit="processRegister(event)">
                    <div class="row">
                        <div class="col-md-6">
                            <label class="fw-bold small mb-1">Mã Sinh viên</label>
                            <input type="text" class="form-control" id="regCode" placeholder="VD: HE150123" required>
                        </div>
                        <div class="col-md-6">
                            <label class="fw-bold small mb-1">Họ và tên</label>
                            <input type="text" class="form-control" id="regName" placeholder="Nguyễn Văn A" required>
                        </div>
                    </div>

                    <label class="fw-bold small mb-1">Email đăng ký</label>
                    <div class="input-group mb-3">
                        <span class="input-group-text"><i class="bi bi-envelope-plus"></i></span>
                        <input type="email" class="form-control with-icon" id="regEmail" placeholder="Bắt buộc dùng @fpt.edu.vn" required>
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <label class="fw-bold small mb-1">Mật khẩu</label>
                            <input type="password" class="form-control" id="regPass" placeholder="Tối thiểu 6 ký tự" required minlength="6">
                        </div>
                        <div class="col-md-6">
                            <label class="fw-bold small mb-1">Xác nhận MK</label>
                            <input type="password" class="form-control" id="regPassConfirm" placeholder="Nhập lại mật khẩu" required>
                        </div>
                    </div>

                    <button type="submit" class="btn-custom bg-success mt-3" id="btnRegister">
                        <i class="bi bi-person-plus-fill me-2"></i> Hoàn tất Đăng ký
                    </button>
                </form>

                <div class="text-center mt-4 small">
                    Đã có tài khoản? <span class="toggle-link" onclick="toggleForms('login')">Quay lại Đăng nhập</span>
                </div>
            </div>

        </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="sysToast" class="toast align-items-center border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body fw-bold text-white" id="toastMessage"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

   
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</html>
