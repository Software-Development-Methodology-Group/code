<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hội Sở - Tạo Khung Chương Trình</title>
    <link rel="stylesheet" href="style-form.css">
</head>
<body>
    <div class="main-content">
        <header>
            <h1>Tạo Khung Chương Trình Đào Tạo (Hội Sở)</h1>
        </header>

        <div class="form-container">
            <form id="programForm">
                <div class="section-title">1. Thông tin chung</div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Tên chương trình:</label>
                        <input type="text" id="programName" placeholder="VD: Kỹ thuật Phần mềm" required>
                    </div>
                    <div class="form-group">
                        <label>Hệ đào tạo:</label>
                        <select id="programLevel">
                            <option value="Cao đẳng">Cao đẳng</option>
                            <option value="Đại học">Đại học</option>
                        </select>
                    </div>
                </div>

                <div class="section-title" style="margin-top: 30px;">2. Danh sách môn học</div>
                <table id="subjectTable">
                    <thead>
                        <tr>
                            <th>Tên môn học</th>
                            <th>Số tín chỉ</th>
                            <th>Loại môn</th>
                            <th>Hành động</th>
                        </tr>
                    </thead>
                    <tbody id="subjectBody">
                        <tr>
                            <td><input type="text" class="sub-name" placeholder="VD: Lập trình Java Spring Boot" required></td>
                            <td><input type="number" class="sub-credit" min="1" max="5" value="3" required></td>
                            <td>
                                <select class="sub-type">
                                    <option value="Bắt buộc">Bắt buộc</option>
                                    <option value="Tự chọn">Tự chọn</option>
                                </select>
                            </td>
                            <td><button type="button" class="btn-delete" onclick="removeRow(this)">Xóa</button></td>
                        </tr>
                    </tbody>
                </table>
                
                <button type="button" class="btn-add" id="btnAddSubject">+ Thêm môn học</button>

                <div class="form-actions">
                    <button type="submit" class="btn-save">Lưu Khung Chương Trình</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script-form.js"></script>
</body>
</html>
